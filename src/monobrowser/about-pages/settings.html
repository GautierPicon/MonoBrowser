<!DOCTYPE html>
<html lang="en"{{THEME_ATTR}}>
<head>
<link rel="icon" href="{{FAVICON}}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>
<style>
  {{COMMON_CSS}}
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    user-select: none;
  }
  h1 {
    font-size: 28px;
    margin: 48px 0 8px;
    font-weight: 600;
  }
  .subtitle {
    font-size: 14px;
    color: #6e6e73;
    margin-bottom: 32px;
  }
  .subtitle-spaced {
    margin-top: 36px;
  }
  .option .icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }
  .option .check.push {
    margin-left: auto;
  }
  .option-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 340px;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border: 1px solid #d2d2d7;
    border-radius: 10px;
    background: #ffffff;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: background 0.15s, border-color 0.15s;
  }
  .option:hover {
    background: #f0f0f2;
    border-color: #aeaeb2;
  }
  .option.selected {
    border-color: #5b8def;
    background: rgba(91,141,239,0.12);
  }
  .option .check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #aeaeb2;
    flex-shrink: 0;
    transition: border-color 0.15s, background 0.15s;
  }
  .option.selected .check {
    border-color: #5b8def;
    background: #5b8def;
    box-shadow: inset 0 0 0 4px #ffffff;
  }
  .option .label {
    font-size: 16px;
    font-weight: 500;
  }
  .option .url {
    font-size: 12px;
    color: #6e6e73;
    margin-top: 2px;
  }
  .theme-dark .subtitle { color: #98989d; }
  .theme-dark .option {
    background: #2c2c2e;
    border-color: #48484a;
    color: #f5f5f7;
  }
  .theme-dark .option:hover { background: #3a3a3c; border-color: #636366; }
  .theme-dark .option.selected { background: rgba(91,141,239,0.22); }
  .theme-dark .option.selected .check { box-shadow: inset 0 0 0 4px #2c2c2e; }
  .theme-dark .option .url { color: #98989d; }
</style>
</head>
<body>
  <h1>Settings</h1>
  <p class="subtitle">Search engine</p>
  <div class="option-group">
    <a class="option{{#google}}" href="https://monobrowser.internal/set-search?google">
      <span class="check"></span>
      <div>
        <div class="label">Google</div>
        <div class="url">google.com</div>
      </div>
    </a>
    <a class="option{{#duckduckgo}}" href="https://monobrowser.internal/set-search?duckduckgo">
      <span class="check"></span>
      <div>
        <div class="label">DuckDuckGo</div>
        <div class="url">duckduckgo.com</div>
      </div>
    </a>
  </div>
  <p class="subtitle subtitle-spaced">Appearance</p>
  <div class="option-group">
    <a class="option{{#system}}" href="https://monobrowser.internal/set-theme?system">
      <img class="icon" src="{{ICON_SYSTEM}}" alt="">
      <div class="label">System</div>
      <span class="check push"></span>
    </a>
    <a class="option{{#light}}" href="https://monobrowser.internal/set-theme?light">
      <img class="icon" src="{{ICON_LIGHT}}" alt="">
      <div class="label">Light</div>
      <span class="check push"></span>
    </a>
    <a class="option{{#dark}}" href="https://monobrowser.internal/set-theme?dark">
      <img class="icon" src="{{ICON_DARK}}" alt="">
      <div class="label">Dark</div>
      <span class="check push"></span>
    </a>
  </div>
  <p class="subtitle subtitle-spaced">Session</p>
  <div class="option-group">
    <a class="option{{#restore}}" href="https://monobrowser.internal/set-restore?toggle">
      <span class="check"></span>
      <div>
        <div class="label">Restore previous session</div>
        <div class="url">Reopen tabs and window geometry on launch</div>
      </div>
    </a>
  </div>
</body>
</html>
