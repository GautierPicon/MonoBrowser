<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page could not be loaded</title>
<style>
  {{COMMON_CSS}}

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #f5f5f7;
    color: #1d1d1f;
    user-select: none;
    text-align: center;
    padding: 0 40px;
  }

  .globe {
    width: 72px;
    height: 72px;
    opacity: 0.45;
    margin-bottom: 28px;
  }

  h1 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 12px;
    color: #000000;
  }

  .url {
    font-size: 15px;
    color: #1d1d1f;
    font-weight: 500;
    max-width: 560px;
    word-break: break-all;
    margin-bottom: 8px;
  }

  .reason {
    font-size: 13px;
    color: #86868b;
    max-width: 560px;
    margin-bottom: 32px;
  }

  .retry {
    display: inline-block;
    padding: 9px 32px;
    border-radius: 8px;
    background: #5b8def;
    color: #ffffff;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.15s;
  }

  .retry:hover {
    background: #4a7de0;
  }

  @media (prefers-color-scheme: dark) {
    h1 { color: #ffffff; }
    .url { color: #f5f5f7; }
  }
</style>
</head>
<body>
  <img class="globe" src="{{ICON}}" alt="Globe">
  <h1>This page can’t be reached</h1>
  <p class="url">{{URL}}</p>
  <p class="reason">{{REASON}}</p>
  <a class="retry" href="{{RETRY}}">Retry</a>
</body>
</html>
