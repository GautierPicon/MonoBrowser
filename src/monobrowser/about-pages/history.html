<!DOCTYPE html>
<html lang="en"{{THEME_ATTR}}>
<head>
<link rel="icon" href="{{FAVICON}}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History</title>
<style>
  {{COMMON_CSS}}
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    user-select: none;
    padding-bottom: 48px;
  }
  h1 {
    font-size: 28px;
    margin: 48px 0 8px;
    font-weight: 600;
  }
  .subtitle {
    font-size: 14px;
    color: #6e6e73;
    margin-bottom: 20px;
  }
  .search {
    width: min(680px, 88vw);
    font-size: 15px;
    font-family: inherit;
    color: #1d1d1f;
    background: #ffffff;
    border: 1px solid #d2d2d7;
    border-radius: 10px;
    padding: 10px 16px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search:focus {
    border-color: #5b8def;
    box-shadow: 0 0 0 3px rgba(91,141,239,0.2);
  }
  .search::placeholder { color: #86868b; }
  .list {
    width: min(680px, 88vw);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .entry {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 2px;
    border-radius: 8px;
  }
  .entry-link {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 8px;
    border-radius: 8px;
    text-decoration: none;
    color: inherit;
    transition: background 0.12s;
  }
  .entry-link:hover { background: rgba(0,0,0,0.05); }
  .icon-wrap {
    position: relative;
    width: 28px;
    height: 28px;
    flex-shrink: 0;
  }
  .monogram {
    position: absolute;
    inset: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }
  .favicon {
    position: absolute;
    inset: 0;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    object-fit: contain;
    background: #ffffff;
  }
  .theme-dark .favicon { background: #2c2c2e; }
  .meta {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .title {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .url {
    font-size: 12px;
    color: #6e6e73;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .remove {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    text-decoration: none;
    font-size: 17px;
    line-height: 1;
    color: #86868b;
    transition: background 0.12s, color 0.12s;
  }
  .remove:hover { background: rgba(215,0,21,0.12); color: #d70015; }
  .time {
    font-size: 12px;
    color: #86868b;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .empty {
    color: #86868b;
    font-size: 15px;
    margin-top: 48px;
  }
  .clear {
    margin-top: 24px;
    font-size: 13px;
    color: #d70015;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid rgba(215,0,21,0.35);
    transition: background 0.15s;
  }
  .clear:hover { background: rgba(215,0,21,0.08); }
  .theme-dark .subtitle { color: #98989d; }
  .theme-dark .search {
    color: #f5f5f7;
    background: #2c2c2e;
    border-color: #48484a;
  }
  .theme-dark .search::placeholder { color: #98989d; }
  .theme-dark .entry-link:hover { background: rgba(255,255,255,0.06); }
  .theme-dark .url { color: #98989d; }
  .theme-dark .time { color: #98989d; }
  .theme-dark .remove { color: #98989d; }
  .theme-dark .remove:hover { background: rgba(255,105,97,0.15); color: #ff6961; }
  .theme-dark .empty { color: #98989d; }
  .theme-dark .clear {
    color: #ff6961;
    border-color: rgba(255,105,97,0.35);
  }
  .theme-dark .clear:hover { background: rgba(255,105,97,0.1); }
</style>
</head>
<body>
  <h1>History</h1>
  <p class="subtitle">{{COUNT}}</p>
  <input class="search" id="search" type="search" placeholder="Search history" autocomplete="off" spellcheck="false">
  <div class="list" id="list">{{ROWS}}</div>
  <p class="empty" id="empty" {{EMPTY_HIDDEN}}>No history yet.</p>
  <a class="clear" id="clear" href="https://monobrowser.internal/clear-history?confirm" {{CLEAR_HIDDEN}}>Clear history</a>
  <script>
    (function () {
      var input = document.getElementById('search');
      var list = document.getElementById('list');
      var empty = document.getElementById('empty');
      var rows = Array.prototype.slice.call(list.children);
      function apply() {
        var query = input.value.trim().toLowerCase();
        var visible = 0;
        rows.forEach(function (row) {
          var match = !query || (row.getAttribute('data-search') || '').indexOf(query) !== -1;
          row.style.display = match ? '' : 'none';
          if (match) visible += 1;
        });
        if (rows.length === 0) {
          empty.textContent = 'No history yet.';
          empty.hidden = false;
          return;
        }
        if (visible === 0) {
          empty.textContent = 'No results for “' + input.value.trim() + '”.';
          empty.hidden = false;
        } else {
          empty.hidden = true;
        }
      }
      input.addEventListener('input', apply);
      if (rows.length === 0) {
        input.style.display = 'none';
      }
      apply();
    })();
  </script>
</body>
</html>
