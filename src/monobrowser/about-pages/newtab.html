<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #f5f5f7;
    color: #1d1d1f;
    user-select: none;
  }

  h1 {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.5px;
    color: #000000;
    margin-bottom: 32px;
  }

  form {
    width: min(560px, 80vw);
  }

  input[type="search"] {
    width: 100%;
    font-size: 16px;
    font-family: inherit;
    color: #1d1d1f;
    background: #ffffff;
    border: 1px solid #d2d2d7;
    border-radius: 12px;
    padding: 14px 20px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input[type="search"]:focus {
    border-color: #5b8def;
    box-shadow: 0 0 0 3px rgba(91, 141, 239, 0.2);
  }

  input[type="search"]::placeholder {
    color: #86868b;
  }
</style>
</head>
<body>
  <h1>MonoBrowser</h1>
  <form action="https://monobrowser.internal/search" method="get">
    <input type="search" name="q" placeholder="Search or enter address" autocomplete="off">
  </form>
</body>
</html>
