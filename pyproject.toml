[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MonoBrowser"
version = "0.1.0"
description = "A minimal Browser"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyqt6>=6.11.0",
    "pyqt6-webengine>=6.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/monobrowser"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
