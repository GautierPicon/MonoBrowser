[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MonoBrowser"
version = "1.0.0"
description = "A minimal Browser"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyqt6>=6.11.0",
    "pyqt6-webengine>=6.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/monobrowser"]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pyinstaller>=6.21.0",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
